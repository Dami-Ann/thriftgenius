<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrift Genius Admin</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", sans-serif;
        background: #f5f5f5;
        color: #111;
        font-size: 14px;
      }

      /* LOGIN */
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f4220;
      }
      .login-box {
        background: white;
        padding: 40px;
        border-radius: 8px;
        width: 100%;
        max-width: 380px;
      }
      .login-box h2 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .login-box p {
        color: #888;
        font-size: 13px;
        margin-bottom: 28px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .form-group input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }
      .form-group input:focus {
        border-color: #1a6b35;
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background: #1a6b35;
        color: white;
        border: none;
        border-radius: 4px;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .login-btn:hover {
        background: #0f4220;
      }
      .error-msg {
        color: #c0392b;
        font-size: 12px;
        margin-top: 10px;
        text-align: center;
        display: none;
      }

      /* DASHBOARD */
      .dashboard {
        display: none;
      }
      .topbar {
        background: white;
        border-bottom: 1px solid #eee;
        padding: 0 32px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .topbar h1 {
        font-size: 16px;
        font-weight: 700;
      }
      .logout-btn {
        background: none;
        border: 1.5px solid #ddd;
        padding: 6px 16px;
        border-radius: 4px;
        font-family: "Inter", sans-serif;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
      }
      .logout-btn:hover {
        border-color: #c0392b;
        color: #c0392b;
      }

      .main {
        padding: 32px;
        max-width: 1100px;
        margin: 0 auto;
      }

      /* STATS */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 32px;
      }
      .stat-card {
        background: white;
        padding: 20px 24px;
        border-radius: 8px;
        border: 1px solid #eee;
      }
      .stat-card .num {
        font-size: 28px;
        font-weight: 700;
        color: #1a6b35;
      }
      .stat-card .label {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }

      /* ADD PRODUCT FORM */
      .section-card {
        background: white;
        border-radius: 8px;
        border: 1px solid #eee;
        padding: 24px;
        margin-bottom: 24px;
      }
      .section-card h2 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid #f0f0f0;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .form-grid .full {
        grid-column: span 2;
      }

      .admin-input,
      .admin-select,
      .admin-textarea {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
        background: white;
      }
      .admin-input:focus,
      .admin-select:focus,
      .admin-textarea:focus {
        border-color: #1a6b35;
      }
      .admin-textarea {
        resize: vertical;
        min-height: 80px;
      }
      .admin-label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }

      /* SIZES */
      .sizes-wrap {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .size-chip {
        padding: 6px 14px;
        border: 1.5px solid #ddd;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        background: white;
        font-family: "Inter", sans-serif;
      }
      .size-chip.selected {
        background: #1a6b35;
        color: white;
        border-color: #1a6b35;
      }

      .submit-btn {
        background: #1a6b35;
        color: white;
        border: none;
        padding: 11px 28px;
        border-radius: 4px;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        margin-top: 8px;
      }
      .submit-btn:hover {
        background: #0f4220;
      }
      .submit-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      /* PRODUCTS TABLE */
      .products-table {
        width: 100%;
        border-collapse: collapse;
      }
      .products-table th {
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 10px 12px;
        border-bottom: 1px solid #eee;
      }
      .products-table td {
        padding: 12px;
        border-bottom: 1px solid #f5f5f5;
        font-size: 13px;
        vertical-align: middle;
      }
      .products-table tr:last-child td {
        border-bottom: none;
      }
      .products-table img {
        width: 44px;
        height: 54px;
        object-fit: cover;
        border-radius: 4px;
        background: #f5f5f5;
      }

      .badge {
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 600;
      }
      .badge.available {
        background: #e8f5ed;
        color: #1a6b35;
      }
      .badge.sold {
        background: #f5f5f5;
        color: #888;
      }

      .action-btn {
        background: none;
        border: 1px solid #ddd;
        padding: 5px 12px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        transition: all 0.15s;
        margin-right: 4px;
      }
      .action-btn.toggle {
        color: #1a6b35;
        border-color: #1a6b35;
      }
      .action-btn.toggle:hover {
        background: #1a6b35;
        color: white;
      }
      .action-btn.delete {
        color: #c0392b;
        border-color: #c0392b;
      }
      .action-btn.delete:hover {
        background: #c0392b;
        color: white;
      }

      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(60px);
        background: #111;
        color: white;
        padding: 10px 22px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        z-index: 999;
        transition: transform 0.25s ease;
        white-space: nowrap;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 680px) {
        .stats {
          grid-template-columns: 1fr;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .form-grid .full {
          grid-column: span 1;
        }
        .main {
          padding: 16px;
        }
        .topbar {
          padding: 0 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div class="login-wrap" id="login-wrap">
      <div class="login-box">
        <h2>Thrift Genius</h2>
        <p>Admin dashboard — sign in to continue</p>
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="login-email"
            placeholder="admin@thriftgenius.com"
          />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <button class="login-btn" id="login-btn">Sign In</button>
        <p class="error-msg" id="error-msg">Invalid email or password</p>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
      <div class="topbar">
        <h1>Thrift Genius Admin</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div class="main">
        <!-- Stats -->
        <div class="stats">
          <div class="stat-card">
            <div class="num" id="stat-total">0</div>
            <div class="label">Total Products</div>
          </div>
          <div class="stat-card">
            <div class="num" id="stat-available">0</div>
            <div class="label">Available</div>
          </div>
          <div class="stat-card">
            <div class="num" id="stat-sold">0</div>
            <div class="label">Sold Out</div>
          </div>
        </div>

        <!-- Add Product -->
        <div class="section-card">
          <h2>Add New Product</h2>
          <div class="form-grid">
            <div>
              <label class="admin-label">Product Name</label>
              <input
                type="text"
                class="admin-input"
                id="p-name"
                placeholder="e.g. Vintage Jacket"
              />
            </div>
            <div>
              <label class="admin-label">Price (₦)</label>
              <input
                type="number"
                class="admin-input"
                id="p-price"
                placeholder="e.g. 15000"
              />
            </div>
            <div>
              <label class="admin-label">Category</label>
              <select class="admin-select" id="p-category">
                <option value="">Select category</option>
                <optgroup label="Clothing">
                  <option value="clothing-dress">Dress</option>
                  <option value="clothing-top">Top</option>
                  <option value="clothing-jerseys">Jerseys</option>
                  <option value="clothing-jacket">Jacket</option>
                </optgroup>
                <optgroup label="Bottoms">
                  <option value="bottoms-jorts">Jorts</option>
                  <option value="bottoms-lowrise">Lowrise jeans</option>
                  <option value="bottoms-skirts">Skirts</option>
                  <option value="bottoms-leather">Leather pants</option>
                  <option value="bottoms-pants">Pants</option>
                </optgroup>
                <optgroup label="Footwear">
                  <option value="footwear-sneakers">Sneakers</option>
                  <option value="footwear-boots">Boots</option>
                  <option value="footwear-flats">Flats</option>
                  <option value="footwear-heels">Heels</option>
                </optgroup>
                <optgroup label="Bags">
                  <option value="bags">Bags</option>
                </optgroup>
                <optgroup label="Accessories">
                  <option value="accessories-belts">Belts</option>
                  <option value="accessories-jewelry">Jewelry</option>
                  <option value="accessories-caps">Caps</option>
                  <option value="accessories-sunglasses">Sunglasses</option>
                  <option value="accessories-scarfes">Scarfes</option>
                </optgroup>
                <optgroup label="Thrift Finds">
                  <option value="thrift-finds">
                    Thrift Finds / One of One
                  </option>
                </optgroup>
              </select>
            </div>
            <div>
              <label class="admin-label">Badge</label>
              <select class="admin-select" id="p-badge">
                <option value="new">New</option>
                <option value="">None</option>
              </select>
            </div>
            <div class="full">
              <label class="admin-label">Description</label>
              <textarea
                class="admin-textarea"
                id="p-description"
                placeholder="Describe the item — condition, material, style..."
              ></textarea>
            </div>
            <div class="full">
              <label class="admin-label">Sizes (click to select)</label>
              <div class="sizes-wrap" id="sizes-wrap">
                <button class="size-chip" data-size="XS">XS</button>
                <button class="size-chip" data-size="S">S</button>
                <button class="size-chip" data-size="M">M</button>
                <button class="size-chip" data-size="L">L</button>
                <button class="size-chip" data-size="XL">XL</button>
                <button class="size-chip" data-size="XXL">XXL</button>
                <button class="size-chip" data-size="36">36</button>
                <button class="size-chip" data-size="37">37</button>
                <button class="size-chip" data-size="38">38</button>
                <button class="size-chip" data-size="39">39</button>
                <button class="size-chip" data-size="40">40</button>
                <button class="size-chip" data-size="41">41</button>
                <button class="size-chip" data-size="42">42</button>
                <button class="size-chip" data-size="43">43</button>
                <button class="size-chip" data-size="44">44</button>
                <button class="size-chip" data-size="45">45</button>
              </div>
            </div>
            <div class="full">
               <label class="admin-label">Images (max 8)</label>
              <input
                type="file"
                class="admin-input"
                id="p-images"
                accept="image/*"
                multiple
              />
            </div>
            <div class="full">
              <label class="admin-label">Video (optional)</label>
              <input
                type="file"
                class="admin-input"
                id="p-video"
                accept="video/*"
              />
            </div>
          </div>
          <button class="submit-btn" id="submit-btn" onclick="addProduct()">
            Add Product
          </button>
        </div>

        <!-- Orders -->
        <div class="section-card">
          <h2>Recent Orders</h2>
          <table class="products-table">
            <thead>
              <tr>
                <th>Customer</th>
                <th>Phone</th>
                <th>Items</th>
                <th>Total</th>
                <th>Delivery Day</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="orders-tbody"></tbody>
          </table>
        </div>
        <!-- Products List -->
        <div class="section-card">
          <h2>All Products</h2>
          <table class="products-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody"></tbody>
          </table>
        </div>

      <div

  </div>
</div>

      const API = "https://thriftgenius-backend.onrender.com/api";
      let token = localStorage.getItem("tg_admin_token");

      // Check if already logged in
      if (token) {
        showDashboard();
      }

      // Login
      document
        .getElementById("login-btn")
        .addEventListener("click", async () => {
          const email = document.getElementById("login-email").value;
          const password = document.getElementById("login-password").value;

            const res = await fetch(`${API}/auth/login`, {

              headers: { "Content-Type": "application/json" },

            localStorage.setItem("tg_admin_token", token);

      function compressImage(file, maxWidth = 1200, quality = 0.7) {
        return new Promise((resolve) => {
          const img = new Image();
          const reader = new FileReader();
          reader.onload = (e) => {
            img.src = e.target.result;
          };
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(
              (blob) => {
                resolve(blob);
              },
              "image/jpeg",
              quality,
            );
          };
          reader.readAsDataURL(file);
        });
      }

      // Delete product
       async function deleteProduct(id, source) {
  const confirmed = confirm(
    "Are you sure you want to delete this product?"
  );

  if (!confirmed) return;

  try {
    // =========================
    // DELETE SUPABASE PRODUCT
    // =========================
    if (source === "supabase") {
      // First get the product's image paths so we can remove them
      const { data: imageRecords, error: imageFetchError } =
        await supabaseClient
          .from("product_images")
          .select("image_url")
          .eq("product_id", id);

      if (imageFetchError) {
        throw new Error(
          "Could not find product images: " +
            imageFetchError.message
        );
      }

      // Delete image records from product_images
      const { error: imageDeleteError } =
        await supabaseClient
          .from("product_images")
          .delete()
          .eq("product_id", id);

      if (imageDeleteError) {
        throw new Error(
          "Could not delete image records: " +
            imageDeleteError.message
        );
      }

      // Delete the product itself
      const { error: productDeleteError } =
        await supabaseClient
          .from("products")
          .delete()
          .eq("id", id);

      if (productDeleteError) {
        throw new Error(
          "Could not delete product: " +
            productDeleteError.message
        );
      }

      // Remove the actual files from Supabase Storage
      if (imageRecords && imageRecords.length) {
        const paths = imageRecords
          .map((record) => {
            const marker =
              "/storage/v1/object/public/product-images/";

            const index = record.image_url.indexOf(marker);

            if (index === -1) return null;

            return record.image_url.substring(
              index + marker.length
            );
          })
          .filter(Boolean);

        if (paths.length) {
          const { error: storageError } =
            await supabaseClient.storage
              .from("product-images")
              .remove(paths);

          if (storageError) {
            console.warn(
              "Product deleted, but some storage images could not be removed:",
              storageError.message
            );
          }
        }
      }

      showToast("Product deleted");
      setTimeout(() => loadProducts(), 500);
      return;
    }

    // =========================
    // DELETE OLD RENDER PRODUCT
    // =========================
    if (source === "render") {
      const res = await fetch(`${API}/products/${id}`, {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${token}`,
        },
      });

      if (res.status === 401 || res.status === 403) {
        showToast("Session expired.");
        logout();
        return;
      }

      if (!res.ok) {
        throw new Error("Delete failed");
      }

      showToast("Product deleted");
      setTimeout(() => loadProducts(), 500);
      return;
    }

    throw new Error("Unknown product source");
  } catch (err) {
    console.error("Delete product error:", err);
    showToast("Error deleting product: " + err.message);
  }
}
